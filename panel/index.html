<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>İçerik Paneli · bbasaran.net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#F6F5F2;--surface:#FFFFFF;--ink:#16232B;--muted:#5D6B73;--line:#DEDCD5;
  --accent:#1F6F6B;--ochre:#C08A2E;--red:#B5442F;
  --serif:"Bodoni Moda",Georgia,serif;--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.gizli{display:none!important}

/* giriş */
#giris{min-height:100vh;display:grid;place-items:center;padding:24px}
.giris-kutu{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 26px;display:grid;gap:14px}
.giris-kutu h1{font-family:var(--serif);font-size:24px;margin:0}
.ust-yazi{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0}

/* üst çubuk */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ust{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ust h1{font-family:var(--serif);font-size:20px;margin:0}
.ust .bosluk{flex:1}
.durum{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:3px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.durum.kirli{background:color-mix(in srgb,var(--ochre) 18%,transparent);color:#8a5f14}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.ana{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ana:hover:not(:disabled){opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.ana:disabled{opacity:1;background:var(--surface);color:var(--muted);border-color:var(--line)}
.btn.kucuk{padding:4px 9px;font-size:12.5px;font-weight:600}
.btn.sil{color:var(--red)}
.btn.sil:hover:not(:disabled){border-color:var(--red);color:var(--red)}
nav.sekmeler{max-width:980px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.sekmeler button{border:0;background:none;padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.sekmeler button.aktif{color:var(--accent);border-bottom-color:var(--accent)}
.rozet{display:inline-block;margin-left:6px;background:var(--ochre);color:#fff;border-radius:9px;padding:0 7px;font-size:10px;letter-spacing:0}

main{max-width:980px;margin:0 auto;padding:22px 20px 80px}
.mesaj{margin-bottom:16px;padding:11px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-size:14.5px}
.mesaj.iyi{border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.mesaj.kotu{border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
.mesaj button{margin-left:10px}
.aciklama{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:70ch}

/* alanlar */
.kart{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px}
.kart h2{font-family:var(--serif);font-size:19px;margin:0 0 14px}
.alan{display:grid;gap:5px;margin-bottom:13px}
.alan > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.alan input,.alan select,.alan textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:#fff}
.alan textarea{resize:vertical;line-height:1.5}
.alan input:focus,.alan select:focus,.alan textarea:focus{outline:none;border-color:var(--accent)}
.alan small{color:var(--muted);font-size:12.5px}
.iki{display:grid;gap:0 14px}
@media (min-width:640px){.iki{grid-template-columns:1fr 1fr}.uc{grid-template-columns:110px 1fr 1fr}}

/* listeler */
.oge{border:1px solid var(--line);border-radius:5px;margin-bottom:10px;background:#FCFBF9}
.oge > summary,.oge-bas{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;list-style:none}
.oge > summary::-webkit-details-marker{display:none}
.oge-ad{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oge-no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.oge-ic{padding:4px 12px 12px;border-top:1px solid var(--line)}
.oge[open] > summary{border-bottom:0}
.ekle{width:100%;border:1px dashed var(--line);background:none;padding:9px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:600}
.ekle:hover{border-color:var(--accent);color:var(--accent)}

/* istatistik */
.sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.sayi{border:1px solid var(--line);border-radius:5px;padding:11px 13px;background:#FCFBF9}
.sayi b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1}
.sayi span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cubuklar{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line);padding-top:6px}
.cubuk{flex:1;min-width:2px;background:color-mix(in srgb,var(--accent) 65%,#fff);border-radius:2px 2px 0 0}
.cubuk:hover{background:var(--accent)}
.cubuk.bos{background:var(--line)}
.eksen{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.siralama{display:grid;gap:6px;margin-top:4px}
.satir{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:5px}
.satir span:last-child{font-family:var(--mono);color:var(--muted)}
.satir .ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bos-veri{color:var(--muted);font-size:14px}
.hareketler{display:grid;gap:0}
.hareket{display:grid;grid-template-columns:132px 1fr;gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--line)}
.hareket:last-child{border-bottom:0}
.hareket time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.hareket .ne{font-weight:600;font-size:14.5px}
.hareket .tekrar{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ochre)}
.hareket .ayrinti{grid-column:2;font-size:13px;color:var(--muted)}
.hareket-ust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hareket-ust select{padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:13.5px;max-width:100%}
@media (max-width:560px){.hareket{grid-template-columns:1fr}.hareket .ayrinti{grid-column:1}}
.gsc-satir{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 14px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:5px 0}
.gsc-satir.bas{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gsc-satir .ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsc-satir .s{font-family:var(--mono);color:var(--muted);text-align:right;min-width:52px}
@media (max-width:560px){.gsc-satir{grid-template-columns:1fr auto auto}.gsc-satir .sira-s{display:none}}
.ist-sekmeler{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 0 16px}
.ist-sekmeler button{border:0;background:none;padding:10px 13px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ist-sekmeler button.aktif{color:var(--accent);border-bottom-color:var(--accent)}
.ist-sekmeler .say{font-family:var(--mono);font-size:11px;font-weight:400;margin-left:6px;opacity:.8}
.tablo{margin-bottom:6px}
.tablo-s{display:grid;grid-template-columns:var(--sut);gap:4px 14px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.tablo-s.bas{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:0}
.tablo-s > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablo-s .s{font-family:var(--mono);color:var(--muted);text-align:right}
@media (max-width:560px){.tablo-s{grid-template-columns:var(--sut-dar,var(--sut))}.tablo-s .ikincil{display:none}}
.hareket .meta{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.yol{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;font-size:13.5px}
.yol .adim{color:var(--ink)}
.yol .adim.tik{color:var(--accent);font-weight:600}
.yol .ok{color:var(--muted);font-size:12px}
.yol .bos{color:var(--muted)}
@media (max-width:560px){.yol{grid-column:1}}
.secim{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.ara-baslik{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.sure{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sure button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.sure button.aktif{border-color:var(--accent);color:var(--accent);font-weight:600}

/* adaylar */
.aday{border:1px solid color-mix(in srgb,var(--ochre) 45%,transparent);background:color-mix(in srgb,var(--ochre) 7%,#fff);border-radius:5px;padding:11px 13px;margin-bottom:9px}
.aday p{margin:0 0 8px}
.aday .kaynak{color:var(--muted);font-size:13.5px}
.aday .dugmeler{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<div id="giris">
  <form class="giris-kutu" id="girisForm">
    <p class="ust-yazi">bbasaran.net</p>
    <h1>İçerik paneli</h1>
    <label class="alan"><span>Şifre</span><input type="password" id="sifre" autocomplete="current-password" required></label>
    <button class="btn ana" type="submit" id="girisBtn">Giriş</button>
    <div class="mesaj kotu gizli" id="girisHata" role="alert"></div>
  </form>
</div>

<div id="uygulama" class="gizli">
  <header>
    <div class="ust">
      <h1>İçerik paneli</h1>
      <span class="durum" id="durum">Güncel</span>
      <span class="bosluk"></span>
      <a class="btn" href="/" target="_blank" rel="noopener">Siteyi aç</a>
      <button class="btn" id="onizleBtn" type="button">Önizle</button>
      <button class="btn ana" id="kaydetBtn" type="button" disabled>Kaydet &amp; Yayınla</button>
      <button class="btn" id="cikisBtn" type="button">Çıkış</button>
    </div>
    <nav class="sekmeler" id="sekmeler"></nav>
  </header>
  <main>
    <div id="mesaj" class="mesaj gizli" role="status"></div>
    <div id="icerik"></div>
  </main>
</div>

<script src="/lib/sayfa.js"></script>
<script>
(function () {
  'use strict';
  var API = '/api/panel';
  var sifre = '';
  var veri = null, surum = '', temel = '';
  var etkin = 'kapak';
  var listeler = {};

  var SEKMELER = [
    ['kapak', 'Kapak'], ['hakkinda', 'Hakkımda'], ['arastirma', 'Araştırma'], ['calismalar', 'Çalışmalar'],
    ['yontem', 'Yöntem'], ['yayinlar', 'Yayınlar'], ['guncel', 'Güncel çağrı'], ['iletisim', 'İletişim'],
    ['istatistik', 'İstatistik']
  ];
  var DIZINLER = ['', 'SSCI', 'SCI-E', 'ESCI', 'AHCI', 'Scopus', 'TR Dizin'];

  function $(id) { return document.getElementById(id); }
  function el(etiket, nitelikler, cocuklar) {
    var e = document.createElement(etiket);
    Object.keys(nitelikler || {}).forEach(function (k) {
      if (k === 'text') e.textContent = nitelikler[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), nitelikler[k]);
      else if (k === 'value') e.value = nitelikler[k];
      else e.setAttribute(k, nitelikler[k]);
    });
    (cocuklar || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  // Kayıtlı metinlerdeki HTML varlıklarını (&amp; gibi) düz yazıya çevirir; sayfa üretilirken yeniden kaçırılır.
  function coz(x) {
    if (typeof x === 'string') return x.replace(/&(amp|lt|gt|quot|#39);/g, function (m, a) { return { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }[a]; });
    if (Array.isArray(x)) return x.map(coz);
    if (x && typeof x === 'object') { var o = {}; Object.keys(x).forEach(function (k) { o[k] = coz(x[k]); }); return o; }
    return x;
  }

  function temizVeri() {
    var v = JSON.parse(JSON.stringify(veri));
    v.site.kapak.bilgiler.forEach(function (b) { b.satirlar = b.satirlar.map(function (s) { return s.trim(); }).filter(Boolean); });
    v.site.iletisim.konular = v.site.iletisim.konular.map(function (s) { return s.trim(); }).filter(Boolean);
    ['makaleler', 'bolumler'].forEach(function (g) { v.yayinlar[g].forEach(function (k) { k.yil = parseInt(k.yil, 10) || 0; }); });
    return v;
  }

  function post(govde) {
    govde.sifre = sifre;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(govde) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) { var e = new Error(d.hata || ('HTTP ' + r.status)); e.status = r.status; throw e; }
          return d;
        });
      });
  }

  function mesaj(m, tur, eylem) {
    var k = $('mesaj');
    k.innerHTML = '';
    if (!m) { k.className = 'mesaj gizli'; return; }
    k.className = 'mesaj ' + (tur || '');
    k.appendChild(document.createTextNode(m));
    if (eylem) k.appendChild(el('button', { class: 'btn kucuk', type: 'button', text: eylem[0], onclick: eylem[1] }));
  }

  var sonKayit = '';
  function kirliMi() { return veri && JSON.stringify(veri) !== temel; }
  function degisti() {
    var kirli = kirliMi();
    var btn = $('kaydetBtn');
    btn.disabled = !kirli;
    btn.textContent = kirli ? 'Kaydet & Yayınla' : (sonKayit ? 'Kaydedildi ✓' : 'Değişiklik yok');
    var d = $('durum');
    d.textContent = kirli ? 'Kaydedilmemiş değişiklik var' : (sonKayit ? 'Kaydedildi · ' + sonKayit : 'Güncel');
    d.className = 'durum' + (kirli ? ' kirli' : '');
  }

  /* ---------- form parçaları ---------- */
  function alan(etiket, nesne, anahtar, s) {
    s = s || {};
    var girdi;
    if (s.secenekler) {
      girdi = el('select', {}, s.secenekler.map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
      girdi.value = nesne[anahtar] == null ? '' : nesne[anahtar];
    } else if (s.cok) {
      girdi = el('textarea', { rows: s.satir || 3 });
      girdi.value = nesne[anahtar] || '';
    } else {
      girdi = el('input', { type: s.tur || 'text' });
      girdi.value = nesne[anahtar] == null ? '' : nesne[anahtar];
    }
    if (s.yer) girdi.setAttribute('placeholder', s.yer);
    girdi.addEventListener(s.secenekler ? 'change' : 'input', function () {
      nesne[anahtar] = girdi.value;
      if (s.degisince) s.degisince(girdi.value);
      degisti();
    });
    return el('label', { class: 'alan' }, [el('span', { text: etiket }), girdi, s.ipucu ? el('small', { text: s.ipucu }) : null]);
  }

  // Satır başına bir öğe: diziyi tek metin kutusunda düzenler
  function satirAlani(etiket, nesne, anahtar, ipucu) {
    var t = el('textarea', { rows: Math.max(3, (nesne[anahtar] || []).length + 1) });
    t.value = (nesne[anahtar] || []).join('\n');
    t.addEventListener('input', function () { nesne[anahtar] = t.value.split('\n'); degisti(); });
    return el('label', { class: 'alan' }, [el('span', { text: etiket }), t, ipucu ? el('small', { text: ipucu }) : null]);
  }

  // Sıralanabilir liste: her öğe açılır kutu, yukarı/aşağı/sil düğmeleriyle
  function listeDuzenle(dizi, s) {
    var kap = el('div');
    function ciz(acik) {
      kap.innerHTML = '';
      dizi.forEach(function (oge, i) {
        var ad = el('span', { class: 'oge-ad', text: s.ad(oge, i) });
        var yukari = el('button', { class: 'btn kucuk', type: 'button', title: 'Yukarı taşı', text: '↑', onclick: function (e) { e.preventDefault(); if (i > 0) { dizi.splice(i - 1, 0, dizi.splice(i, 1)[0]); degisti(); ciz(i - 1); } } });
        var asagi = el('button', { class: 'btn kucuk', type: 'button', title: 'Aşağı taşı', text: '↓', onclick: function (e) { e.preventDefault(); if (i < dizi.length - 1) { dizi.splice(i + 1, 0, dizi.splice(i, 1)[0]); degisti(); ciz(i + 1); } } });
        var sil = el('button', { class: 'btn kucuk sil', type: 'button', text: 'Sil', onclick: function (e) { e.preventDefault(); if (confirm('"' + s.ad(oge, i) + '" silinsin mi?')) { dizi.splice(i, 1); degisti(); ciz(-1); } } });
        var ic = el('div', { class: 'oge-ic' });
        s.ciz(oge, ic, function () { ad.textContent = s.ad(dizi[i], i); }, i);
        var d = el('details', { class: 'oge' }, [el('summary', {}, [el('span', { class: 'oge-no', text: String(i + 1).padStart(2, '0') }), ad, yukari, asagi, sil]), ic]);
        if (i === acik) d.open = true;
        kap.appendChild(d);
      });
      if (s.yeni && (!s.en || dizi.length < s.en)) {
        kap.appendChild(el('button', { class: 'ekle', type: 'button', text: '+ ' + s.ekle, onclick: function () { dizi[s.basa ? 'unshift' : 'push'](s.yeni()); degisti(); ciz(s.basa ? 0 : dizi.length - 1); } }));
      }
    }
    ciz(-1);
    kap.yeniden = ciz;
    return kap;
  }

  function kart(baslik, cocuklar, aciklama) {
    return el('section', { class: 'kart' }, [el('h2', { text: baslik }), aciklama ? el('p', { class: 'aciklama', text: aciklama }) : null].concat(cocuklar));
  }

  /* ---------- sekmeler ---------- */
  var cizimler = {
    kapak: function (k) {
      var s = veri.site.kapak;
      k.appendChild(kart('Kapak', [
        alan('Unvan', s, 'unvan', { ipucu: 'Kalın yazılan ilk satır.' }),
        alan('Tanıtım', s, 'tanitim', { cok: true, satir: 4 })
      ]));
      k.appendChild(kart('Kapaktaki araçlar', [listeDuzenle(s.araclar, {
        ad: function (x) { return x.etiket || 'Adsız araç'; }, ekle: 'Araç ekle',
        yeni: function () { return { etiket: '', baslik: '', baglanti: '', dugme: '' }; },
        ciz: function (x, ic, ad) {
          ic.appendChild(el('div', { class: 'iki' }, [
            alan('Üst etiket', x, 'etiket', { degisince: ad, yer: 'Örn. ArSi: Araştırma Sihirbazı' }),
            alan('Başlık', x, 'baslik', { yer: 'Örn. Araştırma konusu geliştirme · 11 aşama' })
          ]));
          ic.appendChild(el('div', { class: 'iki' }, [
            alan('Bağlantı', x, 'baglanti', { yer: 'https://...' }),
            alan('Düğme yazısı', x, 'dugme', { yer: 'Örn. Sihirbazı aç' })
          ]));
        }

    }
    return el('div', { class: 'hareket' }, [
      el('time', { text: zamanBicimi.format(new Date(z.bas)), datetime: z.bas }),
      el('span', { class: 'ne' }, [kaynakAdi(z.kaynak), el('span', { class: 'meta', text: satirDetay([CIHAZ_ADI[z.cihaz] || z.cihaz, z.ulke, sureMetni(z.sure)]) })]),
      yol
    ]);
  }

  function ziyaretListesi(liste, ad) {
    var n = gosterim(ad);
    var cocuklar = liste.length ? [el('div', { class: 'hareketler' }, liste.slice(0, n).map(ziyaretSatiri))] : [el('p', { class: 'bos-veri', text: 'Bu aralıkta kayıt yok.' })];
    var d = dahaFazla(ad, liste.length - n);
    if (d) cocuklar.push(d);
    return cocuklar;
  }

  var IST_SEKMELER = [
    ['ziyaretler', 'Ziyaretler'], ['bolumler', 'Açılan bölümler'], ['tiklamalar', 'Tıklamalar'],
    ['kaynaklar', 'Nereden gelindi'], ['google', 'Google aramaları'], ['diger', 'Diğer']
  ];

  var istCizimleri = {
    ziyaretler: function () {
      var tum = istOzet.ziyaretler || [];
      var eylemli = tum.filter(function (z) { return z.adimlar.length; });
      var liste = istSecim.yalnizEylem ? eylemli : tum;
      var kutu = el('input', { type: 'checkbox', onchange: function () { istSecim.yalnizEylem = this.checked; istGosterim.ziyaretler = 25; sekmeCiz(); } });
      kutu.checked = istSecim.yalnizEylem;
      var ust = el('div', { class: 'hareket-ust' }, [el('label', { class: 'secim' }, [kutu, 'Yalnızca sitede bir şey yapanlar (' + eylemli.length + ' / ' + tum.length + ')'])]);
      return [kart('Ziyaretler', [ust].concat(ziyaretListesi(liste, 'ziyaretler')),
        'Her satır bir ziyaret: giriş saati, nereden gelindiği, cihaz, ülke ve sitede kalma süresi. Altında ziyaretçinin sırayla açtığı bölümler ve tıkladıkları (↗) yer alır; bir adımın üzerine gelince saati görünür. Yalnızca sayfayı açıp hiçbir şey yapmayan ziyaretlerin bir kısmı arama motoru ve tarayıcı robotlarıdır.')];
    },
    bolumler: function () {
      var oz = istOzet.bolumOzeti || [];
      var ozet = oz.length ? tablo([['Bölüm', '1fr'], ['Açılış', '70px', { sag: 1 }], ['Kişi', '60px', { sag: 1 }], ['Son açılış', '120px', { sag: 1, ikincil: 1 }]],
        oz.map(function (x) { return [bolumAdi(x.ad), x.n, x.kisi, kisa(x.son)]; })) : el('p', { class: 'bos-veri', text: 'Henüz kayıt yok.' });
      var tum = istOzet.bolumListesi || [];
      var liste = tum.filter(function (x) { return !istSecim.bolum || x.ad === istSecim.bolum; });
      var secim = secimKutusu([['', 'Tüm bölümler']].concat(oz.map(function (x) { return [x.ad, bolumAdi(x.ad)]; })), istSecim.bolum,
        function (v) { istSecim.bolum = v; istGosterim.bolumler = 25; sekmeCiz(); });
      var n = gosterim('bolumler');
      var satirlar = liste.slice(0, n).map(function (x) {
        return el('div', { class: 'hareket' }, [
          el('time', { text: zamanBicimi.format(new Date(x.zaman)), datetime: x.zaman }),
          el('span', { class: 'ne', text: bolumAdi(x.ad) }),
          el('span', { class: 'ayrinti', text: satirDetay([CIHAZ_ADI[x.cihaz] || x.cihaz, x.ulke, kaynakAdi(x.kaynak)]) })
        ]);
      });
      var cocuklar = [ozet, el('h3', { class: 'ara-baslik', text: 'Açılışlar' }), el('div', { class: 'hareket-ust' }, [secim]),
        satirlar.length ? el('div', { class: 'hareketler' }, satirlar) : el('p', { class: 'bos-veri', text: 'Bu aralıkta açılış yok.' })];
      var d = dahaFazla('bolumler', liste.length - n);
      if (d) cocuklar.push(d);
      return [kart('Açılan bölümler', cocuklar, 'Kişi: o bölümü açan farklı ziyaretçi sayısı. Aynı kişi aynı bölümü bir ziyarette yalnızca bir kez sayılır.')];
    },
    tiklamalar: function () {
      var oz = istOzet.tiklamaOzeti || [];
      var ozet = oz.length ? tablo([['Öğe', '1fr'], ['Tıklama', '70px', { sag: 1 }], ['Kişi', '60px', { sag: 1 }], ['Son tıklama', '120px', { sag: 1, ikincil: 1 }]],
        oz.map(function (x) { return [x.ad, x.n, x.kisi, kisa(x.son)]; })) : el('p', { class: 'bos-veri', text: 'Henüz kayıt yok.' });
      return [kart('Tıklamalar', [ozet], 'Kişi: o öğeye tıklayan farklı ziyaretçi sayısı.'), hareketKarti()];
    },
    kaynaklar: function () {
      var oz = istOzet.kaynakOzeti || [];
      var ozet = oz.length ? tablo([['Kaynak', '1fr'], ['Ziyaret', '64px', { sag: 1 }], ['Ort. bölüm', '84px', { sag: 1, ikincil: 1 }], ['Tıklayan', '84px', { sag: 1 }], ['Son geliş', '120px', { sag: 1, ikincil: 1 }]],
        oz.map(function (x) { return [kaynakAdi(x.ad), x.ziyaret, String(x.ortBolum).replace('.', ','), x.tiklayan + ' (%' + Math.round(100 * x.tiklayan / x.ziyaret) + ')', kisa(x.son)]; })) : el('p', { class: 'bos-veri', text: 'Henüz kayıt yok.' });
      var tum = (istOzet.ziyaretler || []).filter(function (z) { return z.kaynak !== 'bilinmiyor'; });
      var liste = tum.filter(function (z) { return !istSecim.kaynak || z.kaynak === istSecim.kaynak; });
      var secim = secimKutusu([['', 'Tüm kaynaklar']].concat(oz.map(function (x) { return [x.ad, kaynakAdi(x.ad)]; })), istSecim.kaynak,
        function (v) { istSecim.kaynak = v; istGosterim.kaynaklar = 25; sekmeCiz(); });
      return [kart('Nereden gelindi', [ozet, el('h3', { class: 'ara-baslik', text: 'Gelişler' }), el('div', { class: 'hareket-ust' }, [secim])].concat(ziyaretListesi(liste, 'kaynaklar')),
        'Ort. bölüm: o kaynaktan gelenlerin bir ziyarette ortalama kaç bölüm açtığı. Tıklayan: bir araca ya da bağlantıya tıklayan ziyaret sayısı. "Doğrudan giriş" adres yazarak, yer iminden ya da kaynağını gizleyen bir uygulamadan (WhatsApp, e-posta gibi) gelindiğini gösterir.'), paylasimKarti()];
    },
    google: function () { return [gscKarti()]; },
    diger: function () {
      return [
        istListe('Ülkeler', istOzet.ulkeler),
        istListe('Cihazlar', istOzet.cihazlar, function (ad) { return CIHAZ_ADI[ad] || ad; }),
        kart('Gizlilik', [el('p', { class: 'aciklama', text: 'Çerez, IP adresi ve kalıcı ziyaretçi kimliği tutulmaz. Oturum numarası sekme kapanınca silinir; bu yüzden aynı kişinin başka bir sekmede ya da başka bir gündeki ziyareti ayrı ziyaretçi sayılır. Tarayıcısında izlenmeme tercihi açık olan ziyaretçiler hiç sayılmaz.' })])
      ];
    }
  };

  function hareketKarti() {
    var tum = istOzet.hareketler || [];
    var adlar = [];
    tum.forEach(function (h) { if (adlar.indexOf(h.ad) < 0) adlar.push(h.ad); });
    adlar.sort(function (a, b) { return a.localeCompare(b, 'tr'); });
    if (istSecili && adlar.indexOf(istSecili) < 0) istSecili = '';

    var secim = secimKutusu([['', 'Tüm tıklamalar']].concat(adlar.map(function (a) { return [a, a]; })), istSecili,
      function (v) { istSecili = v; istGosterim.tiklamalar = 25; sekmeCiz(); });

    var liste = tum.filter(function (h) { return !istSecili || h.ad === istSecili; });
    var n = gosterim('tiklamalar');
    var gorunen = liste.slice(0, n).map(function (h) {
      var ad = el('span', { class: 'ne', text: h.ad });
      if (h.adet > 1) ad.appendChild(el('span', { class: 'tekrar', text: '×' + h.adet, title: 'Aynı kişi kısa sürede ' + h.adet + ' kez tıkladı; tek sayıldı.' }));
      return el('div', { class: 'hareket' }, [
        el('time', { text: zamanBicimi.format(new Date(h.zaman)), datetime: h.zaman }),
        ad,
        el('span', { class: 'ayrinti', text: satirDetay([CIHAZ_ADI[h.cihaz] || h.cihaz, h.ulke, kaynakAdi(h.kaynak)]) })
      ]);
    });

    var cocuklar = [el('div', { class: 'hareket-ust' }, [secim])];
    if (!gorunen.length) cocuklar.push(el('p', { class: 'bos-veri', text: 'Bu aralıkta tıklama yok.' }));
    else cocuklar.push(el('div', { class: 'hareketler' }, gorunen));
    var d = dahaFazla('tiklamalar', liste.length - n);
    if (d) cocuklar.push(d);
    return kart('Son tıklamalar', cocuklar,
      'Her tıklama Türkiye saatiyle gösterilir; altında cihaz, ülke ve o kişinin siteye nereden girdiği yazar. Aynı kişinin aynı öğeye iki dakika içindeki tekrar tıklamaları tek satırda ×sayı olarak görünür.');
  }

  function istCiz(k) {
    var sure = el('div', { class: 'sure' }, [7, 30, 90, 365].map(function (g) {
      var b = el('button', { type: 'button', text: g === 365 ? 'Son 1 yıl' : ('Son ' + g + ' gün'), onclick: function () { istGun = g; istOzet = null; gscVeri = null; istGosterim = {}; sekmeCiz(); istYukle(); gscYukle(); } });
      if (g === istGun) b.className = 'aktif';
      return b;
    }));
    k.appendChild(sure);

    if (!istOzet) {
      k.appendChild(kart('İstatistik', [el('p', { class: 'bos-veri', text: istYukleniyor ? 'Yükleniyor…' : 'Veri bekleniyor.' })]));
      return;
    }

    var t = istOzet.toplam || {}, tz = istOzet.tum_zaman || {};
    var sayilar = [
      ['Ziyaret', t.ziyaret], ['Oturum', t.oturum], ['Bölüm açılışı', t.bolum],
      ['Tıklama', t.tiklama], ['Ölçer kullanımı', t.olcer], ['Toplam ziyaret', tz.ziyaret]
    ].map(function (x) {
      return el('div', { class: 'sayi' }, [el('b', { text: String(x[1] == null ? 0 : x[1]) }), el('span', { text: x[0] })]);
    });

    var gunluk = istOzet.gunluk || [];
    var enYuksek = gunluk.reduce(function (m, g) { return Math.max(m, g.ziyaret); }, 0) || 1;
    var cubuklar = el('div', { class: 'cubuklar' }, gunluk.map(function (g) {
      var y = Math.round((g.ziyaret / enYuksek) * 100);
      var c = el('div', { class: 'cubuk' + (g.ziyaret ? '' : ' bos'), title: g.gun + ': ' + g.ziyaret + ' ziyaret, ' + g.oturum + ' oturum' });
      c.style.height = Math.max(y, 2) + '%';
      return c;
    }));
    var eksen = el('div', { class: 'eksen' }, [
      el('span', { text: gunluk.length ? gunluk[0].gun : '' }),
      el('span', { text: gunluk.length ? gunluk[gunluk.length - 1].gun : '' })
    ]);

    k.appendChild(kart('Özet', [el('div', { class: 'sayilar' }, sayilar), cubuklar, eksen],
      'Ziyaret: sayfanın her açılışı. Oturum: aynı sekmede yapılan gezinmelerin tamamı tek sayılır. Sütunların üzerine gelince günün sayısı görünür.'));

    if (istOzet.ayrinti_hatasi) mesaj('Ayrıntılı kayıtlar okunamadı: ' + istOzet.ayrinti_hatasi, 'kotu');
    if (istOzet.kesik) mesaj('Bu aralıkta çok fazla kayıt var; yalnızca bir kısmı gösteriliyor. Daha kısa bir aralık seçin.', 'kotu');

    var sayac = {
      ziyaretler: (istOzet.ziyaretler || []).filter(function (z) { return z.adimlar.length; }).length,
      bolumler: (istOzet.bolumListesi || []).length,
      tiklamalar: (istOzet.tiklamaOzeti || []).reduce(function (m, x) { return m + x.n; }, 0),
      kaynaklar: (istOzet.kaynakOzeti || []).length,
      google: gscVeri && gscVeri.durum === 'hazir' ? gscVeri.toplam.tiklama : null
    };
    k.appendChild(el('nav', { class: 'ist-sekmeler' }, IST_SEKMELER.map(function (sk) {
      var b = el('button', { type: 'button', onclick: function () { istSekme = sk[0]; try { localStorage.setItem('bb_ist_sekme', sk[0]); } catch (x) {} sekmeCiz(); } }, [sk[1]]);
      if (sayac[sk[0]] != null) b.appendChild(el('span', { class: 'say', text: String(sayac[sk[0]]) }));
      if (sk[0] === istSekme) b.className = 'aktif';
      return b;
    })));
    (istCizimleri[istSekme] || istCizimleri.ziyaretler)().forEach(function (c) { k.appendChild(c); });
  }

  function istYukle() {
    istYukleniyor = true;
    post({ eylem: 'istatistik', gun: istGun }).then(function (d) {
      istYukleniyor = false;
      istOzet = d.ozet;
      if (etkin === 'istatistik') sekmeCiz();
    }).catch(function (e) {
      istYukleniyor = false;
      if (e.status === 401) return cikis('Oturum geçersiz, yeniden giriş yapın.');
      mesaj('İstatistik okunamadı: ' + e.message, 'kotu', ['Yeniden dene', istYukle]);
    });
  }

  function sekmeRozeti() {
    var n = veri && veri.aday && veri.aday.adaylar ? veri.aday.adaylar.length : 0;
    var r = $('rozet-yayin');
    if (r) { r.textContent = n; r.classList.toggle('gizli', !n); r.title = n + ' yeni yayın adayı'; }
  }

  function sekmeleriKur() {
    var nav = $('sekmeler');
    nav.innerHTML = '';
    SEKMELER.forEach(function (s) {
      var b = el('button', { type: 'button', text: s[1], onclick: function () { etkin = s[0]; sekmeCiz(); } });
      if (s[0] === 'yayinlar') b.appendChild(el('span', { class: 'rozet gizli', id: 'rozet-yayin' }));
      b.dataset.ad = s[0];
      nav.appendChild(b);
    });
  }

  function sekmeCiz() {
    Array.prototype.forEach.call($('sekmeler').children, function (b) { b.classList.toggle('aktif', b.dataset.ad === etkin); });
    var k = $('icerik');
    k.innerHTML = '';
    cizimler[etkin](k);
    sekmeRozeti();
  }

  /* ---------- yükleme, kaydetme, önizleme ---------- */
  function yukle() {
    sonKayit = '';
    mesaj('Yükleniyor…');
    return post({ eylem: 'oku' }).then(function (d) {
      veri = coz(d.veri);
      veri.aday.adaylar = veri.aday.adaylar || [];
      surum = d.surum;
      temel = JSON.stringify(veri);
      sekmeCiz();
      degisti();
      mesaj('');
    }).catch(function (e) {
      if (e.status === 401) return cikis('Oturum geçersiz, yeniden giriş yapın.');
      mesaj('İçerik yüklenemedi: ' + e.message, 'kotu', ['Yeniden dene', yukle]);
    });
  }

  function kaydet() {
    var btn = $('kaydetBtn');
    btn.disabled = true;
    btn.textContent = 'Kaydediliyor…';
    mesaj('Kaydediliyor…');
    var gonderilen = JSON.stringify(veri);
    post({ eylem: 'kaydet', surum: surum, veri: temizVeri() }).then(function (d) {
      surum = d.surum;
      temel = gonderilen;
      if (d.degisiklik) sonKayit = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      degisti();
      mesaj(d.degisiklik ? 'Kaydedildi. Site yaklaşık bir dakika içinde güncellenir; sonra sayfayı yenileyerek görebilirsiniz.' : 'Değişiklik yoktu, bir şey yazılmadı.', 'iyi');
    }).catch(function (e) {
      if (e.status === 401) return cikis('Oturum geçersiz, yeniden giriş yapın.');
      if (e.status === 409) return mesaj(e.message, 'kotu', ['Yeniden yükle', function () { if (!kirliMi() || confirm('Kaydedilmemiş değişiklikleriniz kaybolacak. Yeniden yüklensin mi?')) yukle(); }]);
      mesaj('Kaydedilemedi: ' + e.message, 'kotu');
      degisti();
    });
  }

  function onizle() {
    var w = window.open('', '_blank');
    if (!w) return mesaj('Önizleme penceresi açılamadı. Tarayıcının açılır pencere engelini kaldırın.', 'kotu');
    w.document.write('<p style="font-family:sans-serif;padding:20px">Önizleme hazırlanıyor…</p>');
    fetch('/index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      var v = temizVeri();
      var sayfaHtml = window.Sayfa.sayfayiUret(html, { site: v.site, yayinlar: v.yayinlar, guncel: v.guncel });
      var serit = '<div style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#C08A2E;color:#fff;font:600 13px/1.4 sans-serif;text-align:center;padding:7px">Önizleme · Bu değişiklikler henüz kaydedilmedi</div>';
      sayfaHtml = sayfaHtml.replace('</body>', serit + '</body>');
      w.document.open();
      w.document.write(sayfaHtml);
      w.document.close();
    }).catch(function (e) {
      w.close();
      mesaj('Önizleme hazırlanamadı: ' + e.message, 'kotu');
    });
  }

  function cikis(neden) {
    sifre = ''; veri = null; temel = ''; surum = '';
    istOzet = null; istYukleniyor = false; gscVeri = null; gscYukleniyor = false;
    $('uygulama').classList.add('gizli');
    $('giris').classList.remove('gizli');
    $('sifre').value = '';
    var h = $('girisHata');
    h.textContent = neden || '';
    h.classList.toggle('gizli', !neden);
  }

  $('girisForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('girisBtn'), h = $('girisHata');
    sifre = $('sifre').value;
    btn.disabled = true;
    h.classList.add('gizli');
    post({ eylem: 'giris' }).then(function () {
      $('giris').classList.add('gizli');
      $('uygulama').classList.remove('gizli');
      sekmeleriKur();
      return yukle();
    }).catch(function (err) {
      sifre = '';
      h.textContent = err.status === 401 ? 'Hatalı şifre.' : ('Giriş yapılamadı: ' + err.message);
      h.classList.remove('gizli');
    }).then(function () { btn.disabled = false; });
  });

  $('kaydetBtn').addEventListener('click', kaydet);
  $('onizleBtn').addEventListener('click', onizle);
  $('cikisBtn').addEventListener('click', function () {
    if (kirliMi() && !confirm('Kaydedilmemiş değişiklikler var. Yine de çıkılsın mı?')) return;
    cikis();
  });
  window.addEventListener('beforeunload', function (e) { if (kirliMi()) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
